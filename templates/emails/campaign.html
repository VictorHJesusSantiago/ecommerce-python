<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background-color: #3F51B5; color: white; padding: 20px; text-align: center; }
        .content { padding: 20px; }
        .footer { text-align: center; padding: 20px; color: #666; font-size: 0.9em; }
        .btn { display: inline-block; padding: 10px 20px; background-color: #3F51B5; color: white; text-decoration: none; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>{{ campaign.subject }}</h1>
        </div>
        <div class="content">
            <p>Hi {{ subscriber.first_name|default:subscriber.email }},</p>
            {{ campaign.html_content|safe }}
        </div>
        <div class="footer">
            <p><a href="{{ unsubscribe_url }}">Unsubscribe</a></p>
            <p>&copy; 2024 E-Commerce Store. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
